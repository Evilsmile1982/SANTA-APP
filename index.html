<!DOCTYPE html>
<html lang="de">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <meta
    name="theme-color"
    content="#07172f"
  >

  <title>Santa – Dein Brief an den Weihnachtsmann</title>

  <!-- =========================================
       SANTA APP ICON
       ========================================= -->

  <link
    rel="icon"
    type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%2306152f'/%3E%3Ccircle cx='50' cy='55' r='30' fill='%23f3c7a5'/%3E%3Cpath d='M20 48 Q25 12 50 10 Q75 12 80 48 Q65 38 50 42 Q35 38 20 48Z' fill='%23c62828'/%3E%3Ccircle cx='50' cy='12' r='9' fill='white'/%3E%3Cpath d='M28 62 Q50 78 72 62' fill='none' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3Ccircle cx='39' cy='53' r='3' fill='%23333'/%3E%3Ccircle cx='61' cy='53' r='3' fill='%23333'/%3E%3C/svg%3E"
  >

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    body {
      background: #06152f;
      color: white;
    }

    /* =========================================
       HAUPTSZENE
       ========================================= */

    .scene {
      position: relative;
      width: 100%;
      height: 100vh;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 75% 15%,
          rgba(255, 244, 190, 0.18),
          transparent 15%
        ),
        linear-gradient(
          to bottom,
          #06132d 0%,
          #102a51 55%,
          #31577a 100%
        );
    }

    /* =========================================
       STERNE
       ========================================= */

    .stars {
      position: absolute;
      inset: 0;
      z-index: 1;
    }

    .star {
      position: absolute;
      color: #fff6c7;
      font-size: 20px;

      animation:
        twinkle 3s
        infinite
        ease-in-out;
    }

    .star:nth-child(1) {
      top: 10%;
      left: 12%;
    }

    .star:nth-child(2) {
      top: 18%;
      left: 35%;
      animation-delay: 1s;
    }

    .star:nth-child(3) {
      top: 11%;
      right: 18%;
      animation-delay: 0.5s;
    }

    .star:nth-child(4) {
      top: 27%;
      right: 32%;
      animation-delay: 1.5s;
    }

    .star:nth-child(5) {
      top: 33%;
      left: 18%;
      animation-delay: 0.8s;
    }

    .star:nth-child(6) {
      top: 24%;
      right: 8%;
      animation-delay: 2s;
    }

    @keyframes twinkle {

      0%,
      100% {
        opacity: 0.35;
        transform: scale(0.8);
      }

      50% {
        opacity: 1;
        transform: scale(1.2);
      }

    }

    /* =========================================
       MOND
       ========================================= */

    .moon {
      position: absolute;

      top: 7%;
      right: 8%;

      width: 70px;
      height: 70px;

      border-radius: 50%;

      background: #fff5ca;

      box-shadow:
        0 0 30px rgba(255, 245, 202, 0.5),
        0 0 70px rgba(255, 245, 202, 0.2);

      z-index: 2;
    }

    /* =========================================
       NORDLICHT
       ========================================= */

    .aurora {
      position: absolute;

      top: 13%;
      left: -15%;

      width: 130%;
      height: 180px;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(60, 210, 190, 0.13),
          rgba(100, 150, 230, 0.12),
          transparent
        );

      border-radius: 50%;

      transform: rotate(-7deg);

      filter: blur(15px);

      z-index: 1;
    }

    /* =========================================
       SCHNEE
       ========================================= */

    .snow {
      position: absolute;
      inset: 0;

      pointer-events: none;

      z-index: 15;
    }

    .flake {
      position: absolute;

      top: -20px;

      width: 5px;
      height: 5px;

      background: white;

      border-radius: 50%;

      opacity: 0.8;

      animation-name: snowfall;
      animation-timing-function: linear;
      animation-iteration-count: infinite;
    }

    @keyframes snowfall {

      from {
        transform: translateY(-30px);
      }

      to {
        transform: translateY(110vh);
      }

    }

    /* =========================================
       SCHLITTEN
       ========================================= */

    .sleigh {
      position: absolute;

      top: 25%;
      left: -300px;

      display: flex;

      align-items: center;

      gap: 8px;

      z-index: 20;

      animation:
        flySleigh 6s
        ease-in-out
        1.2s
        forwards;
    }

    .reindeer {
      font-size: 48px;
    }

    .sleigh-body {
      font-size: 55px;
    }

    .bells {
      position: absolute;

      top: -35px;
      left: 60px;

      font-size: 20px;

      animation:
        bells 0.5s
        infinite
        alternate;
    }

    @keyframes flySleigh {

      0% {
        transform:
          translateX(0)
          translateY(20px)
          rotate(3deg);
      }

      30% {
        transform:
          translateX(35vw)
          translateY(-15px)
          rotate(-2deg);
      }

      60% {
        transform:
          translateX(70vw)
          translateY(15px)
          rotate(2deg);
      }

      100% {
        transform:
          translateX(115vw)
          translateY(-10px)
          rotate(-2deg);
      }

    }

    @keyframes bells {

      from {
        transform: rotate(-8deg);
      }

      to {
        transform: rotate(8deg);
      }

    }

    /* =========================================
       BERGE
       ========================================= */

    .mountain {
      position: absolute;

      bottom: 12%;

      width: 420px;
      height: 300px;

      background: #b9ccdf;

      transform: rotate(45deg);

      opacity: 0.35;

      z-index: 3;
    }

    .mountain.one {
      left: -200px;
    }

    .mountain.two {
      right: -220px;
      opacity: 0.45;
    }

    /* =========================================
       NORDPOL-DORF
       ========================================= */

    .village {
      position: absolute;

      bottom: 7%;

      width: 100%;
      height: 160px;

      display: flex;

      justify-content: space-around;

      align-items: flex-end;

      padding: 0 20px;

      z-index: 5;
    }

    .house {
      position: relative;

      width: 85px;
      height: 90px;

      background: #493546;

      border-radius: 5px 5px 0 0;

      box-shadow:
        0 0 20px rgba(255, 214, 110, 0.2);
    }

    .house::before {
      content: "";

      position: absolute;

      top: -45px;
      left: -12px;

      width: 0;
      height: 0;

      border-left: 55px solid transparent;
      border-right: 55px solid transparent;
      border-bottom: 55px solid #dce8f3;
    }

    .window {
      position: absolute;

      left: 28px;
      top: 30px;

      width: 30px;
      height: 30px;

      background: #ffd76d;

      box-shadow:
        0 0 18px rgba(255, 215, 109, 0.6);
    }

    /* =========================================
       SANTA
       ========================================= */

    .santa {
      position: absolute;

      left: 50%;
      bottom: 21%;

      transform:
        translateX(-50%)
        scale(0.3);

      opacity: 0;

      font-size: 110px;

      z-index: 25;

      animation:
        santaAppear 1.2s
        ease-out
        4.8s
        forwards;
    }

    .wave {
      position: absolute;

      top: -5px;
      right: -35px;

      font-size: 38px;

      animation:
        waving 0.7s
        ease-in-out
        5.3s
        infinite;
    }

    @keyframes santaAppear {

      0% {
        opacity: 0;

        transform:
          translateX(-50%)
          scale(0.3);
      }

      70% {
        opacity: 1;

        transform:
          translateX(-50%)
          scale(1.08);
      }

      100% {
        opacity: 1;

        transform:
          translateX(-50%)
          scale(1);
      }

    }

    @keyframes waving {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(18deg);
      }

    }

    /* =========================================
       BEGRÜSSUNG
       ========================================= */

    .welcome {
      position: absolute;

      left: 0;
      right: 0;

      bottom: 5%;

      text-align: center;

      padding: 20px;

      opacity: 0;

      animation:
        welcomeAppear 1.5s
        ease-out
        5.2s
        forwards;

      z-index: 30;
    }

    .title {
      font-size: 30px;

      font-weight: 700;

      text-shadow:
        0 2px 10px rgba(0, 0, 0, 0.8);
    }

    .subtitle {
      margin-top: 8px;

      font-size: 17px;

      color: #e6f3ff;
    }

    .hoho {
      margin-top: 18px;

      font-size: 32px;

      font-weight: 800;

      color: #fff1bc;

      text-shadow:
        0 0 15px rgba(255, 220, 120, 0.5);
    }

    @keyframes welcomeAppear {

      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }

    }

    /* =========================================
       START-BUTTON
       ========================================= */

    .start {
      position: absolute;

      left: 50%;
      bottom: 20px;

      transform: translateX(-50%);

      padding: 13px 25px;

      border: none;

      border-radius: 30px;

      background:
        rgba(255, 255, 255, 0.14);

      color: white;

      font-size: 15px;

      backdrop-filter: blur(10px);

      z-index: 50;
    }

  </style>

</head>


<body>

  <div class="scene">

    <!-- =====================================
         STERNE
         ===================================== -->

    <div class="stars">

      <div class="star">✦</div>
      <div class="star">✧</div>
      <div class="star">✦</div>
      <div class="star">✧</div>
      <div class="star">✦</div>
      <div class="star">✧</div>

    </div>


    <!-- MOND -->

    <div class="moon"></div>


    <!-- NORDLICHT -->

    <div class="aurora"></div>


    <!-- SCHNEE -->

    <div
      class="snow"
      id="snow"
    ></div>


    <!-- =====================================
         SANTA KOMMT MIT DEM SCHLITTEN
         ===================================== -->

    <div class="sleigh">

      <div class="reindeer">
        🦌
      </div>

      <div class="sleigh-body">
        🛷
      </div>

      <div class="bells">
        🔔 ✨ 🔔
      </div>

    </div>


    <!-- BERGE -->

    <div class="mountain one"></div>

    <div class="mountain two"></div>


    <!-- =====================================
         NORDPOL-DORF
         ===================================== -->

    <div class="village">

      <div class="house">
        <div class="window"></div>
      </div>

      <div class="house">
        <div class="window"></div>
      </div>

      <div class="house">
        <div class="window"></div>
      </div>

    </div>


    <!-- =====================================
         SANTA
         ===================================== -->

    <div class="santa">

      🎅

      <div class="wave">
        👋
      </div>

    </div>


    <!-- =====================================
         BEGRÜSSUNG
         ===================================== -->

    <div class="welcome">

      <div class="title">
        Willkommen am Nordpol
      </div>

      <div class="subtitle">
        Santa ist schon unterwegs ...
      </div>

      <div class="hoho">
        Ho Ho Ho! 🎅
      </div>

    </div>

  </div>


  <!-- =======================================
       SCHNEE ERZEUGEN
       ======================================= -->

  <script>

    const snow =
      document.getElementById("snow");

    for (let i = 0; i < 55; i++) {

      const flake =
        document.createElement("div");

      flake.className = "flake";

      flake.style.left =
        Math.random() * 100 + "%";

      flake.style.width =
        (2 + Math.random() * 5) + "px";

      flake.style.height =
        flake.style.width;

      flake.style.opacity =
        0.3 + Math.random() * 0.7;

      flake.style.animationDuration =
        (4 + Math.random() * 6) + "s";

      flake.style.animationDelay =
        (Math.random() * 5) + "s";

      snow.appendChild(flake);

    }

  </script>

</body>

</html>
